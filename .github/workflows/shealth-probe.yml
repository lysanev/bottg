name: Split Android offline toolchain

on:
  push:
    branches:
      - 'tmp/shealth-build-20260816'
    paths:
      - '.github/workflows/shealth-probe.yml'

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download previously prepared toolchain
        uses: actions/download-artifact@v4
        with:
          name: android-offline-toolchain
          path: /tmp/full
          run-id: 31971852249
          github-token: ${{ github.token }}

      - name: Verify and split into connector-sized pieces
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh /tmp/full/android-offline-toolchain.tar.gz
          sha256sum /tmp/full/android-offline-toolchain.tar.gz | tee /tmp/toolchain.sha256
          mkdir -p /tmp/parts
          split -b 180M -d -a 2 /tmp/full/android-offline-toolchain.tar.gz /tmp/parts/toolchain.part.
          ls -lh /tmp/parts
          test -f /tmp/parts/toolchain.part.00
          test -f /tmp/parts/toolchain.part.01
          test -f /tmp/parts/toolchain.part.02
          test ! -f /tmp/parts/toolchain.part.03

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-part-00
          path: /tmp/parts/toolchain.part.00
          retention-days: 1
          compression-level: 0

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-part-01
          path: /tmp/parts/toolchain.part.01
          retention-days: 1
          compression-level: 0

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-part-02
          path: /tmp/parts/toolchain.part.02
          retention-days: 1
          compression-level: 0

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-sha256
          path: /tmp/toolchain.sha256
          retention-days: 1
