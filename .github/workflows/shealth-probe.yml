name: Samsung Health SDK probe

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - 'tmp/shealth-build-20260816'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Samsung SDK endpoint without accepting license
        shell: bash
        run: |
          set -euxo pipefail
          base='https://developer.samsung.com'
          page="$base/health/data/overview.html"
          endpoint="$base/SHealth/file/f11b8b9d-8bd6-4e9d-9899-3711375a91bf"
          curl -sSIL --max-redirs 10 -A 'Mozilla/5.0' "$endpoint" || true
          python3 - <<'PY'
          import requests
          u='https://developer.samsung.com/SHealth/file/f11b8b9d-8bd6-4e9d-9899-3711375a91bf'
          r=requests.head(u,allow_redirects=True,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
          print('HEAD',r.status_code,r.url)
          for k,v in r.headers.items():
              if k.lower() in ('content-type','content-length','content-disposition','location'):
                  print(k, v)
          PY
