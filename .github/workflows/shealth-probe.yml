name: Samsung Health SDK probe

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - 'tmp/shealth-build-20260816'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Maven repositories for Samsung Health Data API 1.1.0
        shell: bash
        run: |
          set -euxo pipefail
          for base in \
            https://repo.maven.apache.org/maven2 \
            https://repo1.maven.org/maven2 \
            https://dl.google.com/dl/android/maven2
          do
            echo "===== $base ====="
            meta="$base/com/samsung/health/samsung-health-data-api/maven-metadata.xml"
            curl -fsSL --max-time 30 "$meta" || true
            echo
            aar="$base/com/samsung/health/samsung-health-data-api/1.1.0/samsung-health-data-api-1.1.0.aar"
            curl -sSIL --max-time 30 "$aar" | sed -n '1,20p' || true
          done
