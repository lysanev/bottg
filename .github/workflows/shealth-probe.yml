name: Samsung Health SDK probe

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - 'tmp/shealth-build-20260816'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official Samsung CodeLab package
        shell: bash
        run: |
          set -euxo pipefail
          url='https://developer.samsung.com/CodeLab/file/e07d84ec-a804-405d-bbc8-3a60c2b1daf6'
          curl -sSIL -A 'Mozilla/5.0' --max-redirs 10 "$url" | sed -n '1,160p' || true
          curl -fL -A 'Mozilla/5.0' --max-redirs 10 "$url" -o /tmp/sample.bin || true
          file /tmp/sample.bin || true
          ls -lh /tmp/sample.bin || true
          unzip -l /tmp/sample.bin 2>/dev/null | grep -E 'samsung-health-data-api|SleepDiary/app/libs' || true
