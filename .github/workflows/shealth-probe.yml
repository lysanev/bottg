name: Kotlin offline Maven bundle

on:
  push:
    branches:
      - 'tmp/shealth-build-20260816'
    paths:
      - '.github/workflows/shealth-probe.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Kotlin build-tools with transitive dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mvn -version
          rm -rf /tmp/m2
          mkdir -p /tmp/m2
          mvn -B -q \
            -Dmaven.repo.local=/tmp/m2 \
            dependency:get \
            -Dartifact=org.jetbrains.kotlin:kotlin-build-tools-impl:2.2.10 \
            -Dtransitive=true
          test -f /tmp/m2/org/jetbrains/kotlin/kotlin-build-tools-impl/2.2.10/kotlin-build-tools-impl-2.2.10.jar
          du -sh /tmp/m2
          find /tmp/m2 -type f | sort | sed -n '1,160p'
          cd /tmp
          tar -czf kotlin-offline-m2.tar.gz -C /tmp/m2 .
          ls -lh kotlin-offline-m2.tar.gz
          sha256sum kotlin-offline-m2.tar.gz

      - name: Upload Maven bundle
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-offline-m2
          path: /tmp/kotlin-offline-m2.tar.gz
          retention-days: 1
          compression-level: 0
